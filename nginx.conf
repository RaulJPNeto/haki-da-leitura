server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Suporte a SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching agressivo de assets estáticos imutáveis
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Desabilitar cache para manifest e service worker do PWA
    location ~* (sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
