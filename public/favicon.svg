<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="hakiGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro Grand Line -->
  <rect width="512" height="512" rx="128" fill="#080a0f" />

  <!-- Aura Haki (Brilho Central) -->
  <circle cx="256" cy="256" r="210" fill="url(#hakiGlow)" />

  <!-- Círculo Externo / Mira do Scanner -->
  <circle cx="256" cy="256" r="180" stroke="url(#ringGrad)" stroke-width="16" stroke-dasharray="24 12" />

  <!-- Pupila / Olho do Haki da Observação -->
  <circle cx="256" cy="256" r="100" fill="#0c1322" stroke="#38bdf8" stroke-width="12" />
  <circle cx="256" cy="256" r="55" fill="#f59e0b" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />

  <!-- Retículos da Lente -->
  <path d="M256 36 V96 M256 416 V476 M36 256 H96 M416 256 H476" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
</svg>
